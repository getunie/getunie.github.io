<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍邀请链接</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 2.5rem 3rem;
            text-align: center;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 { font-size: 1.3rem; margin-bottom: 0.75rem; font-weight: 600; }
        p { opacity: 0.9; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .link-box {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            word-break: break-all;
            font-size: 0.8rem;
            text-align: left;
        }
        .link-box a {
            color: white;
            text-decoration: none;
        }
        .link-box a:hover {
            text-decoration: underline;
        }
        .time {
            margin-top: 1.5rem;
            font-size: 0.75rem;
            opacity: 0.6;
        }
        .hint {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .error {
            color: #ffd4d4;
            background: rgba(255, 0, 0, 0.2);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            font-size: 0.85rem;
            display: none;
        }
        .retry-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        .retry-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .status {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <h1 id="title">正在获取最新邀请链接...</h1>
        <p id="subtitle">请稍候</p>
        <div class="link-box" id="linkBox" style="display:none;">
            <a id="link" href=""></a>
        </div>
        <p class="hint" id="hint" style="display:none;">如果没有自动跳转，请点击上方链接</p>
        <div class="error" id="errorBox">
            <p id="errorText"></p>
            <button class="retry-btn" onclick="fetchInvite()">重试</button>
        </div>
        <div class="status" id="status"></div>
        <div class="time" id="updateTime"></div>
    </div>

    <script>
        var API_URL = "https://api.github.com/repos/getunie/getunie.github.io/contents/invite.json?ref=main";
        var retryCount = 0;
        var MAX_RETRY = 3;

        function fetchInvite() {
            document.getElementById('spinner').style.display = '';
            document.getElementById('title').textContent = '正在获取最新邀请链接...';
            document.getElementById('subtitle').textContent = '请稍候';
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('linkBox').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            document.getElementById('status').textContent = '';

            fetch(API_URL, { cache: 'no-store' })
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(function(data) {
                    // 解码 base64 内容
                    var content = atob(data.content);
                    var invite = JSON.parse(content);

                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('title').textContent = '正在加入队伍...';
                    document.getElementById('subtitle').textContent = '页面将自动跳转到队伍邀请链接';
                    document.getElementById('linkBox').style.display = '';
                    document.getElementById('hint').style.display = '';
                    document.getElementById('link').href = invite.url;
                    document.getElementById('link').textContent = invite.url;

                    if (invite.updated_at) {
                        document.getElementById('updateTime').textContent = '链接更新时间：' + invite.updated_at;
                    }

                    // 立即跳转
                    window.location.href = invite.url;
                })
                .catch(function(err) {
                    retryCount++;
                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('title').textContent = '获取链接失败';
                    document.getElementById('subtitle').textContent = '请稍候重试或手动加入';
                    document.getElementById('errorBox').style.display = '';
                    document.getElementById('errorText').textContent = err.message;
                    document.getElementById('status').textContent = '第 ' + retryCount + ' 次尝试 / 最多 ' + MAX_RETRY + ' 次';

                    // 自动重试
                    if (retryCount < MAX_RETRY) {
                        setTimeout(fetchInvite, 2000);
                    }
                });
        }

        // 页面加载后立即获取
        fetchInvite();
    </script>
</body>
</html>
