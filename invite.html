<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队伍邀请链接</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            color: #888;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
        }
        .tab:hover { color: #667eea; }
        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-content {
            padding: 1.5rem;
            display: none;
        }
        .tab-content.active { display: block; }

        /* 邀请链接样式 */
        .invite-section h2 {
            font-size: 1.3rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 1rem;
        }
        .status-waiting { background: #e8f5e9; color: #2e7d32; }
        .status-processing { background: #fff3e0; color: #e65100; }
        .status-offline { background: #ffebee; color: #c62828; }

        .link-box {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 1rem;
            margin: 1rem 0;
            word-break: break-all;
            font-size: 0.85rem;
            position: relative;
        }
        .link-box a {
            color: #667eea;
            text-decoration: none;
        }
        .copy-btn {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            background: #667eea;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover { background: #5568d3; }
        .copy-btn.copied { background: #4caf50; }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.85rem;
            color: #666;
        }

        /* 排队样式 */
        .queue-info {
            text-align: center;
            padding: 1rem 0;
        }
        .queue-count {
            font-size: 3rem;
            font-weight: 700;
            color: #667eea;
        }
        .queue-label {
            color: #888;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .current-player {
            background: linear-gradient(135deg, #fff3e0, #ffe0b2);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .current-label {
            font-size: 0.8rem;
            color: #e65100;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .current-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #e65100;
        }

        .queue-list {
            margin-top: 1rem;
        }
        .queue-item {
            display: flex;
            align-items: center;
            padding: 0.75rem 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .queue-item:last-child { border-bottom: none; }
        .queue-pos {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: #888;
            margin-right: 0.75rem;
        }
        .queue-name {
            flex: 1;
            font-size: 0.9rem;
        }
        .queue-time {
            font-size: 0.75rem;
            color: #aaa;
        }

        .empty-queue {
            text-align: center;
            padding: 2rem 0;
            color: #aaa;
        }
        .empty-queue .emoji { font-size: 3rem; margin-bottom: 0.5rem; }

        /* 排队按钮 */
        .queue-btn {
            display: block;
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 1rem;
            transition: transform 0.2s;
        }
        .queue-btn:hover { transform: translateY(-2px); }

        .rules {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 1rem;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }
        .rules h3 {
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
            color: #333;
        }
        .rules ol { padding-left: 1.2rem; }
        .rules li { margin-bottom: 0.25rem; }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 2rem 0;
            color: #888;
        }
        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .update-time {
            text-align: center;
            font-size: 0.75rem;
            color: #aaa;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid #f0f0f0;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .form-input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border 0.2s;
        }
        .form-input:focus {
            border-color: #667eea;
            outline: none;
        }
        .form-hint {
            font-size: 0.75rem;
            color: #888;
            margin-top: 0.25rem;
        }
        .form-result {
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
            display: none;
        }
        .form-result.success {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .form-result.error {
            background: #ffebee;
            color: #c62828;
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.9rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="tabs">
                <div class="tab active" data-tab="invite">当前队伍</div>
                <div class="tab" data-tab="queue-join">我要排队</div>
                <div class="tab" data-tab="queue-status">排队情况</div>
            </div>

            <!-- Tab: 当前队伍 -->
            <div class="tab-content active" id="tab-invite">
                <div class="invite-section">
                    <h2 id="inviteTitle">加载中...</h2>
                    <div id="statusBadge" class="status-badge status-offline">离线</div>
                </div>
                <div class="link-box" id="linkBox" style="display:none;">
                    <span id="linkText"></span>
                    <button class="copy-btn" id="copyBtn" onclick="copyLink()">复制</button>
                </div>
                <div class="loading" id="inviteLoading">
                    <div class="spinner"></div>
                    <p>正在获取队伍信息...</p>
                </div>
                <div class="info-row">
                    <span>模式</span>
                    <span id="modeText">-</span>
                </div>
                <div class="info-row">
                    <span>更新时间</span>
                    <span id="inviteTime">-</span>
                </div>
            </div>

            <!-- Tab: 我要排队 -->
            <div class="tab-content" id="tab-queue-join">

                <h2 style="font-size:1.3rem;margin-bottom:0.5rem;">🎯 我要排队<span style="display:inline-block;background:#ff9800;color:white;font-size:0.7rem;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;">实验中</span></h2>
                <p style="color:#888;font-size:0.9rem;margin-bottom:1.5rem;">
                    通过创建 GitHub Issue 来排队，需要 GitHub 账号
                </p>

                <a href="https://github.com/getunie/getunie.github.io/issues/new?labels=queue&template=queue.md&title=%E6%8E%92%E9%98%9F%E7%BB%84%E9%98%9F" target="_blank" class="queue-btn">🐙 提交排队（GitHub Issue）</a>

                <div class="rules" style="margin-top:1.5rem;">
                    <h3>📋 排队规则</h3>
                    <ol>
                        <li>每人（每个邀请链接）只能成功排一次</li>
                        <li>如果加入失败（超时），可以重新排队</li>
                        <li>三个角色加入你的队伍后即完成，自动进行下一个</li>
                        <li>1 分钟内无法加入则跳过，视为失败</li>
                        <li>没人排队时，会回到自己建队等人模式</li>
                    </ol>
                </div>
            </div>

            <!-- Tab: 排队情况 -->
            <div class="tab-content" id="tab-queue-status">
                <div class="queue-info">
                    <div class="queue-count" id="waitingCount">-</div>
                    <div class="queue-label">人正在排队</div>
                </div>

                <div id="currentSection" style="display:none;">
                    <div class="current-player">
                        <div class="current-label">🎯 正在组队</div>
                        <div class="current-name" id="currentName">-</div>
                    </div>
                </div>

                <div class="queue-list" id="queueList">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>正在获取队列信息...</p>
                    </div>
                </div>

                <div class="update-time" id="queueUpdateTime">-</div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        var INVITE_RAW = "https://raw.githubusercontent.com/getunie/getunie.github.io/main/invite.json";
        var INVITE_FALLBACK = "invite.json";
        var QUEUE_RAW = "https://raw.githubusercontent.com/getunie/getunie.github.io/main/queue.json";
        var QUEUE_FALLBACK = "queue.json";
        var QUEUE_FORM_URL = "";
        var QUEUE_FORM_TYPE = "github";
        var REFRESH_INTERVAL = 5000; // 5秒刷新一次
        var useFallback = false; // 是否使用降级源

        // Tab 切换
        document.querySelectorAll('.tab').forEach(function(tab) {
            tab.addEventListener('click', function() {
                var tabName = this.getAttribute('data-tab');
                document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                this.classList.add('active');
                document.getElementById('tab-' + tabName).classList.add('active');
            });
        });

        // 读取 JSON 数据（优先 raw 域名，失败降级到相对路径）
        function fetchJSON(rawUrl, fallbackUrl, callback) {
            var primaryUrl = useFallback ? fallbackUrl : rawUrl;
            fetch(primaryUrl + '?t=' + Date.now(), { cache: 'no-store' })
                .then(function(res) {
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    return res.json();
                })
                .then(function(data) {
                    // 如果当前在降级模式，尝试切回主源
                    if (useFallback) {
                        fetch(rawUrl + '?t=' + Date.now(), { cache: 'no-store' })
                            .then(function(r) {
                                if (r.ok) {
                                    useFallback = false;
                                    return r.json();
                                }
                                throw new Error('still failing');
                            })
                            .then(function(freshData) {
                                callback(freshData);
                            })
                            .catch(function() {
                                callback(data);
                            });
                    } else {
                        callback(data);
                    }
                })
                .catch(function(err) {
                    // 主源失败，尝试降级源
                    if (!useFallback) {
                        useFallback = true;
                        fetch(fallbackUrl + '?t=' + Date.now(), { cache: 'no-store' })
                            .then(function(res) {
                                if (!res.ok) throw new Error('HTTP ' + res.status);
                                return res.json();
                            })
                            .then(function(data) {
                                callback(data);
                            })
                            .catch(function(err2) {
                                console.error('获取数据失败（双源均失败）:', err2);
                                callback(null);
                            });
                    } else {
                        console.error('获取数据失败:', err);
                        callback(null);
                    }
                });
        }

        // 更新邀请信息
        function updateInvite() {
            fetchJSON(INVITE_RAW, INVITE_FALLBACK, function(data) {
                var loading = document.getElementById('inviteLoading');
                var linkBox = document.getElementById('linkBox');
                var badge = document.getElementById('statusBadge');
                var title = document.getElementById('inviteTitle');

                if (!data) {
                    loading.style.display = 'block';
                    linkBox.style.display = 'none';
                    badge.className = 'status-badge status-offline';
                    badge.textContent = '离线';
                    title.textContent = '加载失败';
                    return;
                }

                loading.style.display = 'none';
                linkBox.style.display = 'block';

                document.getElementById('linkText').textContent = data.url;
                document.getElementById('inviteTime').textContent = data.updated_at || '-';

                var modeText = data.mode === 'queue' ? '排队带人模式' : '自建队伍模式';
                document.getElementById('modeText').textContent = modeText;

                if (data.status === 'processing') {
                    badge.className = 'status-badge status-processing';
                    badge.textContent = '正在带人';
                    title.textContent = '🚀 正在组队中';
                } else {
                    badge.className = 'status-badge status-waiting';
                    badge.textContent = '等人中';
                    title.textContent = '🎮 当前队伍';
                }
            });
        }

        // 更新排队状态
        function updateQueue() {
            fetchJSON(QUEUE_RAW, QUEUE_FALLBACK, function(data) {
                if (!data) {
                    document.getElementById('waitingCount').textContent = '-';
                    document.getElementById('queueList').innerHTML =
                        '<div class="empty-queue"><div class="emoji">❌</div><p>获取队列信息失败</p></div>';
                    return;
                }

                document.getElementById('waitingCount').textContent = data.waiting_count || 0;
                document.getElementById('queueUpdateTime').textContent = '更新于 ' + (data.updated_at || '-');

                // 当前正在组队的
                var currentSection = document.getElementById('currentSection');
                if (data.current) {
                    currentSection.style.display = 'block';
                    document.getElementById('currentName').textContent = data.current.name || '匿名用户';
                } else {
                    currentSection.style.display = 'none';
                }

                // 排队列表
                var listEl = document.getElementById('queueList');
                var waiting = data.waiting || [];

                if (waiting.length === 0) {
                    listEl.innerHTML = '<div class="empty-queue"><div class="emoji">😊</div><p>暂时没人排队</p><p style="font-size:0.8rem;">快喊朋友来组队吧</p></div>';
                    return;
                }

                var html = '';
                waiting.forEach(function(item, idx) {
                    html += '<div class="queue-item">' +
                        '<div class="queue-pos">' + (idx + 1) + '</div>' +
                        '<div class="queue-name">' + (item.name || '匿名用户') + '</div>' +
                        '<div class="queue-time">#' + item.number + '</div>' +
                    '</div>';
                });
                listEl.innerHTML = html;
            });
        }

        // 复制链接
        function copyLink() {
            var link = document.getElementById('linkText').textContent;
            navigator.clipboard.writeText(link).then(function() {
                var btn = document.getElementById('copyBtn');
                btn.textContent = '已复制';
                btn.classList.add('copied');
                showToast('链接已复制');
                setTimeout(function() {
                    btn.textContent = '复制';
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(function() {
                showToast('复制失败，请手动复制');
            });
        }

        // Toast 提示
        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2000);
        }

        // 提交排队
        function submitQueue() {
            var name = document.getElementById('queueName').value.trim();
            var url = document.getElementById('queueUrl').value.trim();
            var btn = document.getElementById('submitBtn');
            var formEl = document.getElementById('queueForm');
            var resultEl = document.getElementById('formResult');

            // 校验
            if (!url) {
                showToast('请填写邀请链接');
                return;
            }
            if (url.indexOf('teamtoken') === -1) {
                showToast('链接格式不对，必须包含 teamtoken');
                return;
            }

            // 禁用按钮
            btn.disabled = true;
            btn.textContent = '提交中...';

            // 构造表单数据
            var formData = new FormData();
            formData.append('name', name || '匿名用户');
            formData.append('url', url);

            // 提交到 Getform
            fetch(QUEUE_FORM_URL, {
                method: 'POST',
                body: formData,
            })
            .then(function(response) {
                if (response.ok) {
                    // 提交成功
                    formEl.style.display = 'none';
                    resultEl.className = 'form-result success';
                    resultEl.style.display = 'block';
                    resultEl.innerHTML = '<strong>✅ 排队成功！</strong><br><br>你的队伍已加入排队<br>请耐心等待，轮到你时三个角色会自动加入';
                    showToast('排队成功！');
                } else {
                    throw new Error('HTTP ' + response.status);
                }
            })
            .catch(function(err) {
                resultEl.className = 'form-result error';
                resultEl.style.display = 'block';
                resultEl.innerHTML = '<strong>❌ 提交失败</strong><br><br>' + err.message + '<br><br>请稍后重试';
                btn.disabled = false;
                btn.textContent = '🚀 提交排队';
                showToast('提交失败：' + err.message);
            });
        }

        // 初始化
        updateInvite();
        updateQueue();
        setInterval(function() {
            updateInvite();
            updateQueue();
        }, REFRESH_INTERVAL);
    </script>
</body>
</html>
